{% extends "qnla/layout.html" %}
{% block title %}Resultados – QNLA{% endblock %}
{% block page_title %}Carga de Resultados{% endblock %}

{% block content %}
<div class="row g-3 mb-3">
  <div class="col-md-4">
    <label class="form-label">Torneo</label>
    <select class="form-select" id="torneo-select"></select>
  </div>
</div>

<div id="resultados-list" class="vstack gap-2"></div>
{% endblock %}

{% block scripts %}
<script>
async function loadTorneos() {
  let torneos = await qnlaFetch('/qnla/torneos/activos');
  if (torneos && typeof torneos.json === 'function') {
    torneos = await torneos.json();
  }
  const sel = document.getElementById('torneo-select');
  if (!Array.isArray(torneos) || !torneos.length) {
    sel.innerHTML = '<option value="">No hay torneos</option>';
    return;
  }
  sel.innerHTML = torneos.map(t => `<option value="${t.id}">${t.nombre} ${t.anio}</option>`).join('');
  if (torneos.length) loadPartidos(torneos[0].id);
}

async function loadPartidos(torneoId) {
  const r = await qnlaFetch(`/qnla/admin/partidos/torneo/${torneoId}`);
  if (!r || !r.ok) return;
  const partidos = await r.json();
  const box = document.getElementById('resultados-list');
  box.innerHTML = partidos.map(p => `
    <div class="card border-0 shadow-sm">
      <div class="card-body d-flex flex-wrap align-items-center gap-2 justify-content-between">
        <div>
          <div class="fw-semibold">${p.seleccion_local_nombre ?? '?'} vs ${p.seleccion_visitante_nombre ?? '?'}</div>
          <div class="text-muted small">${new Date(p.fecha_hora).toLocaleString('es')}</div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <input type="number" min="0" class="form-control form-control-sm" style="width:70px" id="gl-${p.id}" value="${p.goles_local ?? 0}">
          <span>-</span>
          <input type="number" min="0" class="form-control form-control-sm" style="width:70px" id="gv-${p.id}" value="${p.goles_visitante ?? 0}">
          <button class="btn btn-sm btn-danger" onclick="guardarResultado(${p.id})">Guardar</button>
        </div>
      </div>
    </div>
  `).join('') || '<div class="text-muted">No hay partidos</div>';
}

async function guardarResultado(partidoId) {
  const gl = parseInt(document.getElementById(`gl-${partidoId}`).value || '0', 10);
  const gv = parseInt(document.getElementById(`gv-${partidoId}`).value || '0', 10);
  const r = await qnlaFetch(`/qnla/admin/partidos/${partidoId}/resultado`, {
    method: 'POST',
    body: JSON.stringify({ goles_local: gl, goles_visitante: gv, recalcular: true })
  });
  if (r && r.ok) alert('Resultado guardado y puntos recalculados ✅');
}

document.getElementById('torneo-select').addEventListener('change', (e) => loadPartidos(e.target.value));

// Llamar a loadTorneos al cargar la página
window.addEventListener('DOMContentLoaded', loadTorneos);
loadTorneos();
</script>
{% endblock %}
