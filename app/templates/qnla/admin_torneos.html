{% extends "qnla/layout.html" %}
{% block title %}Torneos – QNLA{% endblock %}
{% block page_title %}Administración de Torneos{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm mb-4">
  <div class="card-body">
    <h6 class="fw-bold mb-3">Crear torneo</h6>
    <div id="torneos-admin-status" class="alert alert-info py-2 px-3 mb-3" role="alert" style="display:none;"></div>
    <div class="row g-2">
      <div class="col-md-4">
        <label class="form-label">Nombre *</label>
        <input class="form-control" id="t-nombre" maxlength="100" placeholder="Ej: Mundial 2026">
      </div>
      <div class="col-md-2">
        <label class="form-label">Año *</label>
        <input class="form-control" id="t-anio" type="number" min="1900" max="2200" value="2026">
      </div>
      <div class="col-md-3">
        <label class="form-label">Fecha inicio</label>
        <input class="form-control" id="t-fecha-inicio" type="date">
      </div>
      <div class="col-md-3">
        <label class="form-label">Fecha fin</label>
        <input class="form-control" id="t-fecha-fin" type="date">
      </div>
      <div class="col-md-6">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" id="t-desc" rows="2" placeholder="Descripción libre"></textarea>
      </div>
      <div class="col-md-4">
        <label class="form-label">Cierre inscripción</label>
        <input class="form-control" id="t-cierre" type="datetime-local">
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="t-activo" checked>
          <label class="form-check-label" for="t-activo">Activo</label>
        </div>
      </div>
      <div class="col-md-2">
        <label class="form-label">Puntos exacto</label>
        <input class="form-control" id="t-puntos-exacto" type="number" min="0" value="3">
      </div>
      <div class="col-md-2">
        <label class="form-label">Puntos ganador</label>
        <input class="form-control" id="t-puntos-ganador" type="number" min="0" value="1">
      </div>
      <div class="col-md-2">
        <label class="form-label">Puntos fallo</label>
        <input class="form-control" id="t-puntos-fallo" type="number" min="0" value="0">
      </div>
      <div class="col-12 text-end mt-2">
        <button class="btn btn-outline-danger me-2" id="btn-eliminar-torneo" onclick="eliminarTorneo()" disabled>Eliminar torneo</button>
        <button class="btn btn-outline-primary me-2" id="btn-actualizar-torneo" onclick="actualizarTorneo()" disabled>Actualizar torneo</button>
        <button class="btn btn-danger" id="btn-crear-torneo" onclick="crearTorneo()">Crear torneo</button>
      </div>
    </div>
  </div>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <table class="table mb-0">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Año</th>
          <th>Inicio</th>
          <th>Fin</th>
          <th>Cierre inscripción</th>
          <th>Activo</th>
          <th id="th-eliminar" style="display:none;"></th>
        </tr>
      </thead>
      <tbody id="torneos-body">
        <tr><td colspan="7" class="text-center text-muted">Cargando…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// Variables globales
let qnlaSelectedTorneoId = null;
let qnlaTorneos = [];

// Funciones básicas
function qnlaUserEmail() { return (localStorage.getItem('usuario_email') || '').trim().toLowerCase(); }
function qnlaUserName() { return (localStorage.getItem('usuario_name') || '').trim(); }
function qnlaAuthHeaders() {
  return {
    'x-user-email': qnlaUserEmail(),
    'x-user-name': qnlaUserName(),
    'Content-Type': 'application/json'
  };
}
async function qnlaFetch(url, opts = {}) {
  opts.headers = { ...qnlaAuthHeaders(), ...(opts.headers || {}) };
  const r = await fetch(url, opts);
  if (r.status === 401) {
    alert('No estás autorizado. Verifica tu acceso.');
    window.location.href = '/';
    return null;
  }
  return r;
}

// Cargar datos de torneo en el formulario
function loadTorneoForm(torneo) {
  if (!torneo) return;
  document.getElementById('t-nombre').value = torneo.nombre || '';
  document.getElementById('t-anio').value = torneo.anio || 2026;
  document.getElementById('t-desc').value = torneo.descripcion || '';
  document.getElementById('t-fecha-inicio').value = (torneo.fecha_inicio || '').slice(0, 10);
  document.getElementById('t-fecha-fin').value = (torneo.fecha_fin || '').slice(0, 10);
  document.getElementById('t-activo').checked = torneo.activo === true;
}

// Habilitar/deshabilitar botones
function refreshButtonState() {
  const hasSelected = qnlaSelectedTorneoId !== null;
  document.getElementById('btn-actualizar-torneo').disabled = !hasSelected;
  document.getElementById('btn-eliminar-torneo').disabled = !hasSelected;
}

// Resaltar fila seleccionada
function setSelectedRow(tr) {
  document.querySelectorAll('#torneos-body tr').forEach(r => r.classList.remove('table-active'));
  if (tr) tr.classList.add('table-active');
}

// Limpiar formulario
function clearForm() {
  qnlaSelectedTorneoId = null;
  document.getElementById('t-nombre').value = '';
  document.getElementById('t-anio').value = 2026;
  document.getElementById('t-desc').value = '';
  document.getElementById('t-fecha-inicio').value = '';
  document.getElementById('t-fecha-fin').value = '';
  document.getElementById('t-activo').checked = true;
  refreshButtonState();
}

// Cargar torneos
async function loadTorneos() {
  console.log('JS CARGADO - Iniciando carga de torneos');
  const body = document.getElementById('torneos-body');
  
  try {
    const r = await qnlaFetch('/api/torneos-public/activos');
    if (!r || !r.ok) {
      body.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Error cargando torneos</td></tr>';
      return;
    }
    qnlaTorneos = await r.json();
    console.log('Torneos recibidos:', qnlaTorneos);
    
    if (!Array.isArray(qnlaTorneos) || qnlaTorneos.length === 0) {
      body.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Sin torneos</td></tr>';
      return;
    }
    
    body.innerHTML = qnlaTorneos.map((t, idx) => `
      <tr data-torneo-id="${t.id}" style="cursor:pointer;" title="Haz clic para seleccionar">
        <td>${t.id}</td>
        <td>${t.nombre}</td>
        <td>${t.anio}</td>
        <td>${t.fecha_inicio || '-'}</td>
        <td>${t.fecha_fin || '-'}</td>
        <td>${t.cierre_inscripcion ? new Date(t.cierre_inscripcion).toLocaleString() : '-'}</td>
        <td>${t.activo ? '✅' : '❌'}</td>
      </tr>
    `).join('');
    
    // Agregar event listeners a las filas
    document.querySelectorAll('#torneos-body tr').forEach((tr) => {
      tr.addEventListener('click', () => {
        const torneoId = parseInt(tr.dataset.torneoId, 10);
        const torneo = qnlaTorneos.find(t => t.id === torneoId);
        if (torneo) {
          qnlaSelectedTorneoId = torneo.id;
          loadTorneoForm(torneo);
          setSelectedRow(tr);
          refreshButtonState();
        }
      });
    });
  } catch (err) {
    console.error('Error:', err);
    body.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Error al procesar datos</td></tr>';
  }
}

// Actualizar torneo
async function actualizarTorneo() {
  if (!qnlaSelectedTorneoId) {
    alert('Selecciona un torneo para actualizar');
    return;
  }
  
  const payload = {
    nombre: document.getElementById('t-nombre').value.trim(),
    anio: parseInt(document.getElementById('t-anio').value || '2026', 10),
    descripcion: document.getElementById('t-desc').value.trim() || null,
    activo: document.getElementById('t-activo').checked,
    fecha_inicio: document.getElementById('t-fecha-inicio').value || null,
    fecha_fin: document.getElementById('t-fecha-fin').value || null,
  };
  
  if (!payload.nombre) {
    alert('Nombre requerido');
    return;
  }
  
  const r = await qnlaFetch(`/api/torneos/${qnlaSelectedTorneoId}`, {
    method: 'PATCH',
    body: JSON.stringify(payload),
  });
  
  if (r && r.ok) {
    alert('Torneo actualizado correctamente');
    await loadTorneos();
  } else {
    const err = r ? await r.json().catch(() => ({})) : {};
    alert(err.detail || 'Error al actualizar el torneo');
  }
}

// Eliminar torneo
async function eliminarTorneo() {
  if (!qnlaSelectedTorneoId) {
    alert('Selecciona un torneo para eliminar');
    return;
  }
  
  const nombre = document.getElementById('t-nombre').value || `ID ${qnlaSelectedTorneoId}`;
  const ok = confirm(`¿Estás seguro de que quieres eliminar el torneo "${nombre}"?`);
  if (!ok) return;
  
  const r = await qnlaFetch(`/api/torneos/${qnlaSelectedTorneoId}`, {
    method: 'DELETE',
  });
  
  if (r && (r.ok || r.status === 204)) {
    alert('Torneo eliminado correctamente');
    clearForm();
    await loadTorneos();
  } else {
    const err = r ? await r.json().catch(() => ({})) : {};
    alert(err.detail || 'Error al eliminar el torneo');
  }
}

// Crear torneo
async function crearTorneo() {
  const payload = {
    nombre: document.getElementById('t-nombre').value.trim(),
    anio: parseInt(document.getElementById('t-anio').value || '2026', 10),
    descripcion: document.getElementById('t-desc').value.trim() || null,
    activo: document.getElementById('t-activo').checked,
    fecha_inicio: document.getElementById('t-fecha-inicio').value || null,
    fecha_fin: document.getElementById('t-fecha-fin').value || null,
    admin: qnlaUserName() || qnlaUserEmail(),
  };
  
  if (!payload.nombre) {
    alert('Nombre requerido');
    return;
  }
  
  const r = await qnlaFetch('/api/torneos/', {
    method: 'POST',
    body: JSON.stringify(payload),
  });
  
  if (r && r.ok) {
    alert('Torneo creado correctamente');
    clearForm();
    await loadTorneos();
  } else {
    const err = r ? await r.json().catch(() => ({})) : {};
    alert(err.detail || 'Error al crear el torneo');
  }
}

// Cargar al iniciar
document.addEventListener('DOMContentLoaded', () => {
  console.log('DOM listo - cargando torneos');
  clearForm();
  loadTorneos();
});
</script>
{% endblock %}
