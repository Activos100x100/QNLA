{% extends "layout.html" %}

{% block styles %}
<style>
	.welcome-hero {
		min-height: calc(100vh - 120px);
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		text-align: center;
		gap: 22px;
		padding: 12px 0 32px;
	}

	.welcome-title {
		margin: 0;
		font-size: clamp(1.9rem, 3.6vw, 3.1rem);
		line-height: 1.2;
		color: #111827;
		font-weight: 800;
		text-wrap: balance;
	}

	.welcome-subtitle {
		margin: 0;
		font-size: clamp(1rem, 1.5vw, 1.25rem);
		color: #b45309;
		font-weight: 700;
	}

	.welcome-photo {
		width: min(62vw, 420px);
		max-height: 56vh;
		object-fit: cover;
		filter: brightness(1.06) contrast(1.04) saturate(1.03);
		opacity: 1;
		border-radius: 18px;
		box-shadow: 0 20px 52px rgba(0, 0, 0, 0.24);
		border: 3px solid #f3f4f6;
		background: #e5e7eb;
	}

	.welcome-photo-wrap {
		position: relative;
		display: inline-block;
		overflow: hidden;
		border-radius: 18px;
	}

	.welcome-photo-wrap::after {
		content: "QNLA";
		position: absolute;
		left: 16px;
		bottom: 14px;
		transform: rotate(-8deg);
		color: rgba(255, 255, 255, 0.34);
		font-size: clamp(0.82rem, 1.9vw, 1.05rem);
		font-weight: 800;
		letter-spacing: 0.12em;
		text-transform: uppercase;
		white-space: nowrap;
		text-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
		pointer-events: none;
	}
</style>
{% endblock %}

{% block content %}

<section class="welcome-hero">
	<h1 class="welcome-title">Bienvenidos a QNLA 🌍</h1>
	<p class="welcome-subtitle">Tu centro de operaciones está listo 🔥</p>

	<div class="welcome-photo-wrap">
		<img
			class="welcome-photo"
			src="/static/img/nachito_mundialista.png"
			alt="QNLA"
			onerror="this.onerror=null;this.src='/static/img/logo.png';"
		>
	</div>
</section>

{% endblock %}
