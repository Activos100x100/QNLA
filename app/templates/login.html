<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>FTRA - Iniciar sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            background: white;
            position: relative;
            padding: 20px;
        }

        .background-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: url('/static/img/logo.png') no-repeat center;
            background-size: contain;
            opacity: 0.05;
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 40px);
        }

        .upload-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 6px 18px rgba(13, 23, 34, 0.10);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .upload-logo {
            width: 92px;
            height: 92px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #d4af37;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 32px;
        }

        /* Formulario */
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #444;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap .icon {
            position: absolute;
            left: 14px;
            color: #999;
            font-size: 16px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 14px 14px 14px 40px;
            font-size: 15px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            background: #fafafa;
            color: #111;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .form-input:focus {
            border-color: #d4af37;
            background: #fff;
        }

        .form-input.has-toggle {
            padding-right: 44px;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-size: 18px;
            padding: 4px;
            line-height: 1;
        }

        .toggle-btn:hover {
            color: #555;
        }

        /* Error */
        .error-box {
            background: #fff1f1;
            border-left: 4px solid #cc3333;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #5f1b1b;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Botón */
        .btn-login {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #111111 0%, #2a2a2a 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            border: 1px solid #d4af37;
            margin-top: 8px;
            font-family: inherit;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #1a1a1a 0%, #333 100%);
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.4);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #bbb;
        }

        @media (max-width: 600px) {
            .content { padding: 16px; }
            .upload-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <main class="content">
            <div class="background-logo"></div>
            <div class="page">
                <div class="upload-card">

                    <!-- Logo -->
                    <div class="upload-logo">
                        <img src="/static/img/logo.png" alt="Logo FTRA">
                    </div>

                    <h1>Iniciar sesión</h1>
                    <p class="subtitle">Acceso privado · Solo personal autorizado</p>

                    <!-- Error -->
                    {% if error %}
                    <div class="error-box">
                        <span>⚠️</span>
                        <span>{{ error }}</span>
                    </div>
                    {% endif %}

                    <!-- Formulario -->
                    <form method="post" action="/login" autocomplete="on">

                        <div class="form-group">
                            <label for="dni_nie">DNI / NIE</label>
                            <div class="input-wrap">
                                <span class="icon">👤</span>
                                <input
                                    type="text"
                                    class="form-input"
                                    id="dni_nie"
                                    name="dni_nie"
                                    value="{{ dni_nie | default('') }}"
                                    placeholder="12345678A"
                                    autocomplete="username"
                                    required
                                    autofocus
                                    maxlength="20"
                                >
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <div class="input-wrap">
                                <span class="icon">🔒</span>
                                <input
                                    type="password"
                                    class="form-input has-toggle"
                                    id="password"
                                    name="password"
                                    placeholder="••••••••"
                                    autocomplete="current-password"
                                    required
                                >
                                <button type="button" class="toggle-btn" onclick="togglePassword()" tabindex="-1" aria-label="Mostrar contraseña">
                                    <span id="eyeIcon">👁️</span>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-login">
                            🔑 Entrar
                        </button>

                    </form>

                    <p class="footer-note">🛡️ Acceso restringido · FTRA</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈';
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }

        document.getElementById('dni_nie').addEventListener('input', function () {
            const pos = this.selectionStart;
            this.value = this.value.toUpperCase();
            this.setSelectionRange(pos, pos);
        });
    </script>
</body>
</html>
