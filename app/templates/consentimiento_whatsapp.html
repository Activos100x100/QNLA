  {% extends "layout.html" %}
  {% block content %}
  <style>
    .cwa-row-no {
      background: #fee2e2 !important;
      font-weight: 700;
      color: #b91c1c;
    }
    .cwa-btn-wa {
      display: inline-block;
      background: #dc2626;
      color: #fff !important;
      border: none;
      border-radius: 99px;
      padding: 2px 14px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s;
      margin-left: 4px;
    }
    .cwa-btn-wa:hover {
      background: #b91c1c;
      text-decoration: underline;
    }
  .cwa-page { max-width: 900px; margin: 32px auto; padding: 0 16px; }
  .cwa-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .cwa-header h2 { margin: 0; font-size: 22px; color: #1e293b; font-weight: 700; }
  .cwa-tabs-wrap { background: #f1f5f9; border-radius: 12px; padding: 6px 8px; margin-bottom: 16px; }
  .cwa-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .cwa-tab { display: flex; align-items: center; gap: 6px; border: none; background: transparent; color: #64748b; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
  .cwa-tab:hover { background: #e2e8f0; color: #1e293b; }
  .cwa-tab.active { background: #2563eb; color: #fff; font-weight: 600; box-shadow: 0 2px 8px rgba(37,99,235,.3); }
  .cwa-tab .cwa-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.25); color: inherit; }
  .cwa-tab:not(.active) .cwa-badge { background: #e2e8f0; color: #475569; }
  .cwa-table-card { border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .cwa-table-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; }
  .cwa-table-title { font-size: 14px; font-weight: 600; color: #1e293b; }
  .cwa-table-count { font-size: 13px; color: #64748b; }
  .cwa-table { width: 100%; border-collapse: collapse; }
  .cwa-table thead tr { background: #f8fafc; }
  .cwa-table th { padding: 11px 14px; text-align: left; font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
  .cwa-table th[data-sort] { cursor: pointer; user-select: none; }
  .cwa-table th[data-sort]:hover { color: #2563eb; }
  .cwa-table td { padding: 11px 14px; font-size: 13px; color: #334155; border-bottom: 1px solid #f8fafc; vertical-align: middle; }
  .cwa-table tbody tr:last-child td { border-bottom: none; }
  .cwa-table tbody tr:nth-child(even) td { background: #f8fafc; }
  .cwa-table tbody tr:nth-child(odd) td { background: #ffffff; }
  .cwa-table tbody tr:hover td { background: #e9f0fb !important; }
  .cwa-badge-si { background: #dcfce7; color: #16a34a; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; }
  .cwa-badge-no { background: #fee2e2; color: #dc2626; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; }
  .cwa-search-wrap { padding: 10px 16px 0 16px; }
  .cwa-search { width: 100%; box-sizing: border-box; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; color: #334155; outline: none; transition: border-color .15s; }
  .cwa-search:focus { border-color: #2563eb; }
  @media (max-width: 768px) { .cwa-header { flex-direction: column; align-items: flex-start; } .cwa-table th, .cwa-table td { padding: 9px 10px; } }
</style>

<div class="cwa-page">
  <div class="cwa-header">
    <h2>Consentimiento WhatsApp</h2>
  </div>
  <div class="cwa-tabs-wrap">
    <div id="cwaTabs" class="cwa-tabs"></div>
  </div>
  <div class="cwa-table-card">
    <div class="cwa-table-toolbar">
      <span id="cwaTableTitle" class="cwa-table-title">—</span>
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="cwaTableCount" class="cwa-table-count"></span>
        <button id="btnExportarNoSheet" onclick="exportarNoSheet()"
          style="display:none;align-items:center;gap:6px;background:#16a34a;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;"
          onmouseover="this.style.background='#15803d'" onmouseout="this.style.background='#16a34a'">
          &#x1F4E5; Descargar &quot;No&quot; CSV
        </button>
      </div>
    </div>
    <div class="cwa-search-wrap">
      <input id="cwaSearch" class="cwa-search" type="text" placeholder="Buscar por Rider ID, Cod. Activo, Nombre, Teléfono…" autocomplete="off">
    </div>
    <div style="overflow-x:auto; overflow-y:visible;">
      <table class="cwa-table">
        <thead>
          <tr>
            <th data-sort="rider_id">Rider <span class="sort-arrows" data-arrow="rider_id"></span></th>
            <th data-sort="cod_activo">Cod. Activo <span class="sort-arrows" data-arrow="cod_activo"></span></th>
            <th data-sort="nombre_completo">Nombre completo <span class="sort-arrows" data-arrow="nombre_completo"></span></th>
            <th data-sort="telefono">Nro. Teléfono <span class="sort-arrows" data-arrow="telefono"></span></th>
            <th data-sort="consentimiento">Consent. <span class="sort-arrows" data-arrow="consentimiento"></span></th>
          </tr>
        </thead>
        <tbody id="cwaRows">
          <tr><td colspan="5">Seleccione una ciudad para ver empleados</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="/static/js/consentimiento_whatsapp.js?v=20260506b"></script>
{% endblock %}
